    <text x="150" y="230">DOĞUM</text>
    <text x="350" y="230">ÖLÜM</text>
    <text x="550" y="230">SAVAŞ</text>
    <text x="750" y="230">ARZU</text>
    <text x="150" y="400">GÜZELLİK</text>
    <text x="350" y="400">CESARET</text>
    <text x="550" y="400">CEHENNEM</text>
    <text x="750" y="400">KAN</text>
  </g>

  <!-- KTESIFON -->
  <text x="450" y="470" font-size="14" fill="#6C6A72" letter-spacing="4">KTESIFON</text>

  <g color="#17161A">
    <use href="#g-deccal"  transform="translate(150,563) scale(1.15)"/>
    <use href="#g-lavanta" transform="translate(350,563) scale(1.15)"/>
    <use href="#g-herkul"  transform="translate(550,563) scale(1.15)"/>
    <use href="#g-kria"    transform="translate(750,563) scale(1.15)"/>
    <use href="#g-seker"   transform="translate(150,733) scale(1.15)"/>
    <use href="#g-berlin"  transform="translate(350,733) scale(1.15)"/>
    <use href="#g-melodi"  transform="translate(550,733) scale(1.15)"/>
    <use href="#g-kirmizi" transform="translate(750,733) scale(1.15)"/>
  </g>

  <g font-size="13" fill="#17161A" letter-spacing="1.5">
    <text x="150" y="630">DECCAL</text>
    <text x="350" y="630">LAVANTA</text>
    <text x="550" y="630">HERKÜL</text>
    <text x="750" y="630">KRIA</text>
    <text x="150" y="800">ŞEKER</text>
    <text x="350" y="800">BERLİN</text>
    <text x="550" y="800">MELODİ</text>
    <text x="750" y="800">KIRMIZI</text>
  </g>
  <g font-size="10.5" fill="#8C8A92" letter-spacing="0.8">
    <text x="150" y="648">OCAK</text>
    <text x="350" y="648">ARMAĞAN</text>
    <text x="550" y="648">EMEK</text>
    <text x="750" y="648">ÖLÇÜ</text>
    <text x="150" y="818">TALİH</text>
    <text x="350" y="818">SANAT</text>
    <text x="550" y="818">NAĞME</text>
    <text x="750" y="818">HASAT</text>
  </g>

  <!-- SONSUZLUK -->
  <text x="450" y="888" font-size="14" fill="#6C6A72" letter-spacing="4">SONSUZLUK</text>

  <g color="#17161A">
    <use href="#g-gal"  transform="translate(350,981) scale(1.15)"/>
    <use href="#g-laia" transform="translate(550,981) scale(1.15)"/>
  </g>

  <g font-size="13" fill="#17161A" letter-spacing="1.5">
