    <text x="550" y="1048">LAIA</text>
  </g>
  <g font-size="10.5" fill="#8C8A92" letter-spacing="0.8">
    <text x="350" y="1066">VAROLUŞ</text>
    <text x="550" y="1066">KAYIT</text>
  </g>

  <!-- 32 piksel -->
  <line x1="60" y1="1100" x2="840" y2="1100" stroke="#D8D6D0" stroke-width="1"/>
  <g color="#17161A">
    <use href="#g-helena"  transform="translate(72,1140) scale(0.30)"/>
    <use href="#g-sade"    transform="translate(117,1140) scale(0.30)"/>
    <use href="#g-victor"  transform="translate(162,1140) scale(0.30)"/>
    <use href="#g-lilith"  transform="translate(207,1140) scale(0.30)"/>
    <use href="#g-cercei"  transform="translate(252,1140) scale(0.30)"/>
    <use href="#g-timur"   transform="translate(297,1140) scale(0.30)"/>
    <use href="#g-seytan"  transform="translate(342,1140) scale(0.30)"/>
    <use href="#g-wasp"    transform="translate(387,1140) scale(0.30)"/>
    <use href="#g-deccal"  transform="translate(450,1140) scale(0.30)"/>
    <use href="#g-lavanta" transform="translate(495,1140) scale(0.30)"/>
    <use href="#g-herkul"  transform="translate(540,1140) scale(0.30)"/>
    <use href="#g-kria"    transform="translate(585,1140) scale(0.30)"/>
    <use href="#g-seker"   transform="translate(630,1140) scale(0.30)"/>
    <use href="#g-berlin"  transform="translate(675,1140) scale(0.30)"/>
    <use href="#g-melodi"  transform="translate(720,1140) scale(0.30)"/>
    <use href="#g-kirmizi" transform="translate(765,1140) scale(0.30)"/>
    <use href="#g-gal"     transform="translate(820,1140) scale(0.30)"/>
    <use href="#g-laia"    transform="translate(862,1140) scale(0.30)"/>
  </g>
