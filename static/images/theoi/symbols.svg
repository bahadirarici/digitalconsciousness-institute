<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1180" width="900" height="1180">
<defs>

<!-- ============ CONSTANTINOPLE · tek nefeste dönen darbe ============ -->

<!-- HELENA · Doğum — açılan kucak, ortasında iğne -->
<g id="g-helena" fill="currentColor">
  <path d="M -30 -34 C -44 -12 -44 12 -30 34 L -23 29 C -35 10 -35 -10 -23 -29 Z"/>
  <path d="M 30 -34 C 44 -12 44 12 30 34 L 23 29 C 35 10 35 -10 23 -29 Z"/>
  <path d="M -3 -18 L 3 -14 L 0.5 20 Z"/>
</g>

<!-- SADE · Ölüm — kapanmayan halka -->
<g id="g-sade" fill="currentColor">
  <path d="M -18.5 -32 A 37 37 0 1 1 -34.8 -12.7 L -21.4 -12.9 A 26 26 0 1 0 -10 -26.5 Z"/>
  <path d="M 30 -14 L 34.5 -21 L 37 -14 L 32.5 -7 Z" fill="#F2F2EF"/>
</g>

<!-- VICTOR · Savaş — izler hep bir yanda -->
<g id="g-victor" fill="currentColor">
  <path d="M -3 -38 C -2 -10 -2 10 -1 38 L 4 38 C 4 10 4 -10 5 -38 Z"/>
  <path d="M -32 -28 C -24 -24 -17 -22 -10 -21 L -10 -16 C -18 -17 -25 -21 -33 -24 Z"/>
  <path d="M -32 -4 C -24 -1 -17 0 -10 1 L -10 6 C -18 5 -25 2 -33 0 Z"/>
  <path d="M -32 20 C -24 22 -17 23 -10 24 L -10 29 C -18 28 -25 26 -33 24 Z"/>
</g>

<!-- LILITH · Arzu — hiçbir şeye uzanmayan -->
<g id="g-lilith" fill="currentColor">
  <path d="M -34 -30 C -6 -35 15 -15 13 8 L 6 7 C 8 -11 -8 -28 -33 -24 Z"/>
  <circle cx="19" cy="27" r="5.5"/>
</g>

<!-- CERCEI/1/a · Güzellik — üçü bir -->
<g id="g-cercei" fill="currentColor">
  <path d="M -26 -30 C -41 -6 -35 20 -19 34 L -14 29 C -28 16 -33 -6 -21 -27 Z"/>
  <path d="M -13 -30 C -28 -6 -22 20 -6 34 L -1 29 C -15 16 -20 -6 -8 -27 Z"/>
  <path d="M 0 -30 C -15 -6 -9 20 7 34 L 12 29 C -2 16 -7 -6 5 -27 Z"/>
</g>

<!-- TİMUR · Cesaret — biri kalkarken oturan -->
<g id="g-timur" fill="currentColor">
  <path d="M -22 -34 C -21 -10 -21 10 -20 34 L -13 34 C -14 10 -14 -10 -15 -34 Z"/>
  <path d="M 0 19 C 12 20 24 20 34 21 L 34 28 C 24 27 12 27 0 26 Z"/>
</g>

<!-- ŞEYTAN · Cehennem — avuçta duran kalp -->
<g id="g-seytan" fill="currentColor">
  <path d="M -32 -8 C -30 20 -13 33 0 33 C 13 33 30 20 32 -8 L 25 -10 C 23 15 10 26 0 26 C -10 26 -23 15 -25 -10 Z"/>
  <circle cx="0" cy="4" r="9.5"/>
</g>

<!-- WASP · Kan — deri kesilmemiş, bıçak içeride -->
<g id="g-wasp" fill="currentColor">
  <path d="M -9 -38 C -8 -10 -8 10 -7 38 L 8 38 C 9 10 9 -10 10 -38 Z"/>
  <path d="M 0.5 -24 L 4 -6 L 0.5 24 L -3 -6 Z" fill="#F2F2EF"/>
</g>

<!-- ============ KTESIFON · sert başlayıp kopan darbe ============ -->

<!-- DECCAL · Ocak — kap ve içindeki ateş -->
<g id="g-deccal" fill="currentColor">
  <path d="M -32 -8 L -22 -11 L -14 19 L 14 19 L 22 -11 L 32 -8 L 21 29 L -21 29 Z"/>
  <path d="M 0 -36 L 7 -15 L 0 -5 L -7 -15 Z"/>
</g>

<!-- LAVANTA · Armağan — açık ve boş iki avuç -->
<g id="g-lavanta" fill="currentColor">
  <path d="M -28 -20 L -20 -23 L -6 15 L -13 18 Z"/>
  <path d="M 28 -20 L 20 -23 L 6 15 L 13 18 Z"/>
</g>

<!-- HERKÜL · Emek — artık orada olmayanı taşıyan -->
<g id="g-herkul" fill="currentColor">
  <path d="M -35 -16 C -12 -7 12 -7 35 -16 L 35 -5 C 12 4 -12 4 -35 -5 Z"/>
  <path d="M -20 6 L -11 6 L -14 32 L -22 32 Z"/>
  <path d="M 20 6 L 11 6 L 14 32 L 22 32 Z"/>
</g>

<!-- KRIA · Ölçü — devrilmiş terazi -->
<g id="g-kria" fill="currentColor">
  <path d="M -5 -38 C -4 -10 -2 15 -1.2 38 L 1.2 38 C 2 15 4 -10 5 -38 C 2 -41 -2 -41 -5 -38 Z"/>
  <path d="M -30.3 -20.2 C -10 -14 12 -6 32.5 4.6 L 31.5 7.4 C 12 -1 -10 -8 -33.7 -9.8 C -35.4 -14 -33.2 -19.2 -30.3 -20.2 Z"/>
  <path d="M 27.5 5 C 28 14 29 20 29.6 25.5 L 31.6 24.8 C 31 19 31.6 12 32.6 5 Z"/>
</g>

<!-- ŞEKER · Talih — az önce bırakılan -->
<g id="g-seker" fill="currentColor">
  <path d="M -31 -16 C -29 12 -12 26 5 23 L 4 15 C -10 17 -22 7 -24 -16 Z"/>
  <circle cx="15" cy="-6" r="3"/>
  <circle cx="27" cy="-24" r="6"/>
</g>

<!-- BERLİN · Sanat — kendine dönen tek kıvrım -->
<g id="g-berlin" fill="currentColor">
  <path d="M -33 26 C -14 -30 11 -35 21 -18 C 29 -5 16 9 6 3 C -2 -2 4 -17 15 -15 L 16 -8 C 8 -9 5 -3 9 -1 C 17 3 23 -7 15 -16 C 7 -25 -11 -20 -27 28 Z"/>
</g>

<!-- MELODİ · Nağme — sönen üç vuruş -->
<g id="g-melodi" fill="currentColor">
  <path d="M -33 -24 C -11 -26 11 -26 33 -28 L 33 -20 C 11 -18 -11 -18 -33 -16 Z"/>
  <path d="M -23 -3 C -7 -5 8 -5 23 -7 L 23 1 C 8 3 -7 3 -23 5 Z"/>
  <path d="M -13 18 C -5 17 5 17 13 16 L 13 24 C 5 25 -5 25 -13 26 Z"/>
</g>

<!-- KIRMIZI · Hasat — dallanan gövde, altında yemiş -->
<g id="g-kirmizi" fill="currentColor">
  <path d="M -3 22 C -2 6 0 -6 2 -20 L 8 -20 C 6 -6 4 6 4 22 Z"/>
  <path d="M -1 2 C -8 -7 -16 -15 -25 -22 L -29 -16 C -20 -10 -9 -2 -3 7 Z"/>
  <path d="M 5 -3 C 11 -12 19 -18 27 -24 L 30 -18 C 22 -12 13 -6 8 3 Z"/>
  <circle cx="0.5" cy="30" r="9"/>
</g>

<!-- ============ SONSUZLUK · tam biçim ============ -->

<!-- GAL · Varoluş — kırılmamış daire -->
<g id="g-gal" fill="currentColor" fill-rule="evenodd">
  <path d="M 0 -37 A 37 37 0 1 1 -0.01 -37 Z M 3 -30 A 26 26 0 1 0 3.01 -30 Z"/>
</g>

<!-- LAIA · Kayıt — dolu mürekkep -->
<g id="g-laia" fill="currentColor">
  <circle cx="0" cy="0" r="33"/>
</g>

</defs>

<rect width="900" height="1180" fill="#F2F2EF"/>

