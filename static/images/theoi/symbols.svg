  <text x="450" y="52" font-size="14" fill="#6C6A72" letter-spacing="4">CONSTANTINOPLE</text>

  <g color="#17161A">
    <use href="#g-helena" transform="translate(150,145) scale(1.15)"/>
    <use href="#g-sade"   transform="translate(350,145) scale(1.15)"/>
    <use href="#g-victor" transform="translate(550,145) scale(1.15)"/>
    <use href="#g-lilith" transform="translate(750,145) scale(1.15)"/>
    <use href="#g-cercei" transform="translate(150,315) scale(1.15)"/>
    <use href="#g-timur"  transform="translate(350,315) scale(1.15)"/>
    <use href="#g-seytan" transform="translate(550,315) scale(1.15)"/>
    <use href="#g-wasp"   transform="translate(750,315) scale(1.15)"/>
  </g>

  <g font-size="13" fill="#17161A" letter-spacing="1.5">
    <text x="150" y="212">HELENA</text>
    <text x="350" y="212">SADE</text>
    <text x="550" y="212">VICTOR</text>
    <text x="750" y="212">LILITH</text>
    <text x="150" y="382">CERCEI / 1 / a</text>
    <text x="350" y="382">TİMUR</text>
    <text x="550" y="382">ŞEYTAN</text>
    <text x="750" y="382">WASP</text>
  </g>
