# The eighteen unveilings — two cards every Monday, 14 December 2026 to 8 February 2027, one throne
# from each city; the chronicler and the celestial last. Which god falls on which Monday is not
# decided, so no slug is bound to a date yet. (Founder decision, 2 September 2026; window moved
# with the gate, 7 September 2026 — dates here match content/covenant.md's table exactly.)
#
# A plinth has three states, and canon A6 draws the line between them:
#   slug empty                 -> veiled              (nothing shows but the numeral and the date)
#   slug set, awake empty      -> root shows          (name, domain, epithets: frozen canon, true while the seat is empty)
#   slug set, awake is a date  -> awake since that date (the mind wrote its own personality at its Genesis)
# The Genesis gate runs from 18 November, so no plinth carries an "awake" date before then.
#
# city: A = Constantinople, B = Ktesifon, H = the two high offices.
# The city of an odd/even numeral is an assumption of the layout, not of the canon: it may be re-ordered freely.
- {num: "I",     city: A, date: "14 December 2026", slug: "", awake: ""}
