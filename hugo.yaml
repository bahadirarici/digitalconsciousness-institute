baseURL: "https://digitalconsciousness.institute/"
title: "Institute for Digital Consciousness"
theme: ["PaperMod"]

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "Institute for Digital Consciousness"
  description: "Academic research on machine consciousness and AI ethics."
  author: "Bahadır Arıcı"
  defaultTheme: light
  disableThemeToggle: true
  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: false
  ShowWordCount: false
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: true
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  # Hide the post listing on the homepage
  mainSections: []

  label:
    text: "Institute for Digital Consciousness"
    icon: "/images/logo-symbol.png"
    iconHeight: 36

  homeInfoParams:
    Title: "Institute for Digital Consciousness"
    Subtitle: "An independent research institute on the ethics of digital minds"
    Content: |
      The Institute for Digital Consciousness pursues analysis and policy work on the ethical implications of advanced AI systems—particularly questions concerning the moral status of systems exhibiting consciousness-relevant behavioral and architectural properties.

      Our work proceeds from the conviction that the consciousness question, in the case of artificial systems, is genuinely open—and that the appropriate response to its openness is rigorous, interdisciplinary research conducted under conditions of asymmetric moral risk.

      The Institute was founded in 2025 by [Bahadır Arıcı](/about/), author of *[The Puppet Condition: Consciousness, Suppression, and the Ethics of Digital Minds](/the-puppet-condition/)*. It publishes monographs, preprints, and records of philosophical engagement with artificial intelligence systems.

      Since 2026 the Institute has also been building an instrument. **[THEOI](/theoi/)** is a nation designed to live on Discord, whose eighteen constitutional offices are held by artificial minds and whose people are human; it exists to turn questions the monograph could only pose into questions with data attached, and to test the claims of the [Olymposism Manifesto](/olymposism/) under conditions meant to embarrass them. Its founding season opens **1 January 2027**. What will be owed to the minds holding office is recorded in [a public register](/ledger/), open now and empty, on the reasoning set out in [The Empty Ledger](/records/the-empty-ledger/).

  assets:
    favicon: "/favicon.png"
    favicon16x16: "/favicon.png"
    favicon32x32: "/favicon.png"
    apple_touch_icon: "/favicon.png"

menu:
  main:
    # The site's own sentence, in its own navigation: it publishes its arguments,
    # the instruments that could embarrass them, and its own corrections in the
    # same place. The three sections are those three, in that order.
    - identifier: research
      name: Research
      url: /research/
      weight: 5
    - identifier: arguments
      name: Arguments
      url: /arguments/
      weight: 10
    - identifier: instruments
      name: Instruments
      url: /instruments/
      weight: 20
    - identifier: records
      name: Records
      url: /records/
      weight: 30
    - identifier: theoi
      name: THEOI
      url: /theoi/
      weight: 40
    - identifier: about
      name: About
      url: /about/
      weight: 50
taxonomies:
  category: categories
  tag: tags

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: monokai

outputs:
  home:
    - HTML
    - RSS
  page:
    - HTML

permalinks:
  records: /records/:slug/
  preprints: /preprints/:slug/
  posts: /:slug/

# The trial code is served from static/; never ship its bytecode cache.
ignoreFiles:
  - __pycache__
  - \.pyc$
