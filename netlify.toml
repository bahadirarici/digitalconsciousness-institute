[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.146.0"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"
  TZ = "UTC"

[context.production.environment]
  HUGO_ENV = "production"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# The four extracts were removed from the site on 2 September 2026. The papers
# live on Zenodo with their own DOIs; anyone arriving on an old link lands where
# the Institute's arguments now are rather than on a 404.
[[redirects]]
  from = "/preprints/*"
  to = "/arguments/"
  status = 301
