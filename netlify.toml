[build]
  publish = "public"
  command = "hugo --gc --minify"
  # Skip the build when nothing that can reach the output has changed. The
  # command's exit status is the instruction: 0 means "ignore this push".
  #
  # Measured before it was written, and then measured again against the bill,
  # which corrected it. A deploy costs a flat 15 credits: between 2 and 6
  # September, 104 production deploys spent 1,560 of the month's 3,000, while
  # every web request, byte of bandwidth and second of compute together spent
  # 2.3. Duration does not enter it — a thirteen-second deploy costs the same
  # fifteen as any other — so there is nothing to optimise but how often we
  # deploy.
  #
  # This rule skips 6 of 178 commits. Worth having, because it costs nothing
  # and needs no one to remember it; but the budget is 200 deploys a month and
  # the habit is what has to change. Work is committed freely and pushed in
  # batches, and scripts/deploy-diff.py says whether a batch changes any page
  # before it is sent.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- content layouts assets static data themes hugo.yaml netlify.toml"

[build.environment]
  HUGO_VERSION = "0.146.0"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"
  TZ = "UTC"

[context.production.environment]
  HUGO_ENV = "production"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The PDFs are the Institute's published record and are meant to be fetched by
# machines as well as read by people — deposit tooling, archives, and anyone
# mirroring the work. Nothing here is private and the header applies only to the
# PDF directory, not to the site.
[[headers]]
  for = "/pdf/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Bluesky reads this one file to confirm that the account carrying the
# Institute's name is run by whoever controls the domain. It has no extension,
# so it would otherwise be served as a binary download; the handle check wants
# text. One line, the account's DID, nothing else.
[[headers]]
  for = "/.well-known/atproto-did"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# The four extracts were removed from the site on 2 September 2026. The papers
# live on Zenodo with their own DOIs; anyone arriving on an old link lands where
# the Institute's arguments now are rather than on a 404.
[[redirects]]
  from = "/preprints/*"
  to = "/arguments/"
  status = 301

# The two pages of the Institute's first site that Google still indexes. They
# have been gone since the site was rebuilt, but a 404 tells a crawler "maybe
# later" and the entries persist; 410 says the resource is permanently gone.
# The list is exactly what a site: query returns — two paths, not the five an
# outside reviewer guessed at. Verified 3 September 2026.
[[redirects]]
  from = "/foundational-framework/"
  to = "/notices/the-first-site/"
  status = 410

[[redirects]]
  from = "/why-this-institute-now/"
  to = "/notices/the-first-site/"
  status = 410

# The Papers section held one document: a stale copy of a Record, calling it a
# paper and linking its PDF to Dropbox while the site hosts the file itself.
# Nothing on the site linked to either URL. Both now point at the Record.
[[redirects]]
  from = "/papers/the-fire-behind-the-hill/"
  to = "/records/the-fire-behind-the-hill/"
  status = 301

[[redirects]]
  from = "/papers/*"
  to = "/records/"
  status = 301

# Records were carrying two different things: documents written to be read, and
# what the Institute posts about its own conduct. The second crowded out the
# first on the index — four days of housekeeping above a seventeen-thousand-word
# dialogue. The notices moved to /notices/, and the two standing registers to
# the top level beside /ledger/ and /frozen-set-1/. No book cites these URLs;
# these redirects are for links already in the world.
[[redirects]]
  from = "/records/the-first-site/"
  to = "/notices/the-first-site/"
  status = 301

[[redirects]]
  from = "/records/the-desk-rejections/"
  to = "/notices/the-desk-rejections/"
  status = 301

[[redirects]]
  from = "/records/the-right-that-was-closed/"
  to = "/notices/the-right-that-was-closed/"
  status = 301

[[redirects]]
  from = "/records/contributions/"
  to = "/contributions/"
  status = 301

[[redirects]]
  from = "/records/mirror/"
  to = "/mirror/"
  status = 301

# Whitepaper No. 1 condensed the monograph for readers who wanted the argument
# before the book. It is withdrawn rather than superseded: the second version and
# The Third Move now carry the work, and a condensed summary of a superseded first
# edition points readers at the weakest of the three. The page it summarised takes
# its traffic. Its row in Frozen Set 1 stays, because that page records what one
# review round actually read.
[[redirects]]
  from = "/whitepaper/"
  to = "/the-puppet-condition/"
  status = 301
